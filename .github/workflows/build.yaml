name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name ready_templates --org com.templates.app _gen
          cp -r _gen/android ./android
          rm -rf _gen

      - name: Prepare manifest (internet permission + app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="القوالب الجاهزة"|' $M
          perl -0pi -e 's|(<application[^>]*>)|$1\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>|' $M
          cat $M

      - name: Auto-fix pw.Row textDirection (safe on old and new main.dart)
        run: |
          perl -0pi -e 's/(Row\(\n)[ \t]*textDirection: rtl,\n/$1/g' lib/main.dart
          grep -n "textDirection" lib/main.dart || true

      - name: Apply app icon (icon.png in repo root)
        run: |
          if [ -f icon.png ]; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            if command -v convert >/dev/null 2>&1; then IM="convert"; else IM="magick"; fi
            for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
              set -- $p
              mkdir -p android/app/src/main/res/mipmap-$1
              $IM icon.png -resize ${2}x${2} android/app/src/main/res/mipmap-$1/ic_launcher.png
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          else
            echo "icon.png not found, using default icon"
          fi

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: templates-apk
          path: build/app/outputs/flutter-apk/app-release.apk
